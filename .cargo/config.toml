# Default build target for the workspace (the freestanding kernel).
#
# Kernel-specific codegen/link flags (non-PIE at 1 MiB) live in
# kernel/.cargo/config.toml so they never leak into the std `launcher` crate
# (cargo concatenates `rustflags` across config layers, so a closer file cannot
# clear them — the kernel must scope its own). Build the kernel from inside
# `kernel/` (or set RUSTFLAGS); build the launcher from inside `launcher/`.
[build]
target = "x86_64-unknown-none"
