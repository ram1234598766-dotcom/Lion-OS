name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Also publish to PyPI (only via manual dispatch)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build wheel & create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel + sdist
        run: python -m build

      - name: Smoke test the built wheel
        run: |
          python -m pip install dist/*.whl
          python -m lionos --headless

      - name: Run test suite
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -v

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lion-OS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish to PyPI
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::warning::PYPI_API_TOKEN not configured - skipping PyPI publish"
            exit 0
          fi
          python -m pip install twine
          twine upload dist/*
