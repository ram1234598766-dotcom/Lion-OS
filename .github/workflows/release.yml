name: release

# Builds and uploads the LionOS installer packages for every desktop OS on a
# `v*` tag push, then attaches them to a GitHub Release. The GHCR container
# image is published separately by `publish.yml` on the same tag trigger.
#
# Package formats per OS (the standalone installation manager `lionos setup`
# ships inside every one — the package is the launcher, not the OS):
#   Linux   -> .deb  (packaging/deb/build.sh)  + .tar.gz
#   macOS   -> .pkg  (packaging/pkg/build.sh)  + .tar.gz
#   Windows -> .exe  (the release `lionos` binary; the Inno Setup wizard that
#                     launches `lionos setup` is produced separately)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg: deb
          - os: macos-14
            target: aarch64-apple-darwin
            pkg: pkg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            pkg: pkg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build launcher (release)
        working-directory: launcher
        run: cargo build --release --target ${{ matrix.target }}

      # Version = the tag sans the leading "v" (v1.1.0 -> 1.1.0).
      - name: Compute version
        id: ver
        run: |
          echo "ver=${{ github.ref_name }}" | sed 's/^v//'
          echo "ver=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Stage installers
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.ver }}"
          STAGE="$(mktemp -d)"
          BIN="launcher/target/${{ matrix.target }}/release/lionos${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          cp "$BIN" "$STAGE/lionos${{ matrix.os == 'windows-latest' && '.exe' || '' }}"

          if [[ "${{ matrix.pkg }}" == "deb" ]]; then
            packaging/deb/build.sh "$STAGE/lionos" "$VERSION" "$STAGE"
            tar -czf "$STAGE/lionos-${VERSION}-linux-x86_64.tar.gz" -C "$STAGE" lionos
          elif [[ "${{ matrix.pkg }}" == "pkg" ]]; then
            packaging/pkg/build.sh "$STAGE/lionos" "$VERSION" "$STAGE"
            ARCH="${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }}"
            tar -czf "$STAGE/lionos-${VERSION}-macos-${ARCH}.tar.gz" -C "$STAGE" lionos
          fi

          ls -la "$STAGE"
          # Upload the whole staged dir as one artifact.
          cp -r "$STAGE" dist
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Build Inno Setup wizard exe (Windows)
        # The Inno Setup installer IS the double-click setup wizard for Windows:
        # it wraps the built `lionos` binary and launches `lionos setup`.
        if: matrix.pkg == 'exe'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          New-Item -ItemType Directory -Force -Path installer/stage | Out-Null
          Copy-Item "launcher/target/${{ matrix.target }}/release/lionos.exe" "installer/stage/lionos.exe" -Force
          # MyAppVersion is #defined in the .iss (bumped during the release
          # ritual), so no /D override is needed.
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/LionOS-Desktop.iss"
          Get-ChildItem installer/LionOS-Desktop-Setup-*.exe
          # Drop it into dist/ so merge-multiple lands it at assets/dist/*.exe.
          Copy-Item installer/LionOS-Desktop-Setup-*.exe dist/

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/
            launcher/target/${{ matrix.target }}/release/lionos${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  # Build the prebuilt bootable disk image that `lionos setup --release` /
  # `lionos install --release` download instead of building from source. The
  # same `os` build path as publish.yml, staged as `lionos-disk.bin` +
  # `checksums.txt` (the format `update.rs` verifies before use).
  disk-image:
    name: Build prebuilt disk image (lionos-disk.bin)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel build toolchain (NASM + g++ + Zig 0.14)
        run: |
          sudo apt-get update && sudo apt-get install -y nasm g++ build-essential
          curl -sL -o /tmp/zig.tar.xz https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz
          sudo mkdir -p /opt/zig && sudo tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          sudo ln -sf /opt/zig/zig /usr/local/bin/zig
          zig version && g++ --version | head -1

      - name: Install pinned nightly Rust + tools
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-02
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Build kernel boot image (bootloader 0.11 DiskImageBuilder)
        working-directory: os
        run: cargo build

      - name: Stage disk + checksums
        run: |
          mkdir -p dist
          cp target/bios.img dist/lionos-disk.bin
          # update.rs expects "<sha256>  lionos-disk.bin" (two spaces).
          sha256sum dist/lionos-disk.bin | awk '{print $1 "  lionos-disk.bin"}' > dist/checksums.txt
          ls -la dist
          cat dist/checksums.txt

      - name: Upload disk image + checksums
        uses: actions/upload-artifact@v4
        with:
          name: installers-disk
          path: dist/

  release:
    name: Create GitHub Release
    needs: [package, disk-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all installer packages
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List assets
        run: ls -laR assets

      # Each package job uploaded a `dist/` directory (merge-multiple flattens
      # their contents into `assets/dist/`), so the glob must look one level
      # down from `assets/`. The Windows Inno Setup exe is uploaded at the
      # artifact root (assets/*.exe); the prebuilt disk is under assets/dist/.
      - name: Create release + attach installers
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            assets/dist/*.deb
            assets/dist/*.pkg
            assets/dist/*.tar.gz
            assets/dist/*.exe
            assets/lionos-disk.bin
            assets/checksums.txt
