name: publish

# Publishes LionOS as a container package to GHCR. Publishing through a
# workflow (with the `ghcr.io/<repo>/...` namespace + `packages: write`) is what
# links the package to this repository and makes it public — a manual docker
# push creates an unlinked, private, user-scoped package. Runs automatically
# whenever kernel/packaging changes land on main, or when a `v*` release tag is
# pushed (which also tags the image `v0.x.0` per the Monthly Release Ritual).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [kernel/**, packaging/**]
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel build toolchain (NASM + g++ + Zig 0.14)
        # build.rs compiles: GAS/NASM asm (asm/*.asm, .s), C (c/*.c), C++17
        # (cpp/lionos_cpp.cpp via the g++ frontend) and Zig (`zig build-obj`).
        # ubuntu-latest ships gcc/g++ but not nasm or zig, so install those.
        run: |
          sudo apt-get update && sudo apt-get install -y nasm g++ build-essential
          curl -sL -o /tmp/zig.tar.xz https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz
          sudo mkdir -p /opt/zig && sudo tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          sudo ln -sf /opt/zig/zig /usr/local/bin/zig
          zig version && g++ --version | head -1

      - name: Install pinned nightly Rust + tools
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-02
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Build kernel boot image (bootloader 0.11 DiskImageBuilder)
        working-directory: os
        run: cargo build

      - name: Stage a minimal build context
        run: |
          mkdir -p /tmp/lionos-ctx
          cp target/bios.img /tmp/lionos-ctx/bios.img

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Image name is NOT `lionos`: a manual docker push earlier created the
      # user-scoped package `.../lion-os/lionos`, and the workflow's
      # repo-scoped GITHUB_TOKEN cannot write to a user-owned package (403, and
      # a private user package cannot be made public via the REST API).
      - name: Compute lowercase GHCR image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/lion" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: /tmp/lionos-ctx
          file: packaging/Dockerfile
          push: true
          # `latest` + `sha` always; the version tag (e.g. v0.1.0) only on a
          # release-tag push, so `docker pull ghcr.io/<owner>/lion-os/lion:v0.x.0`
          # is a real, pinned artifact.
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}:{1}', steps.image.outputs.name, github.ref_name) || '' }}
          # OCI labels populate the GHCR package page (description/license/source)
          # — part of the Monthly Release Ritual.
          labels: |
            org.opencontainers.image.title=LionOS
            org.opencontainers.image.description=LionOS bootable kernel image for QEMU (Rust, x86_64)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
            org.opencontainers.image.licenses=All-Rights-Reserved
          platforms: linux/amd64
