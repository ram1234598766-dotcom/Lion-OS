name: publish

# Publishes LionOS as a container package to GHCR. Publishing through a
# workflow (with the `ghcr.io/<repo>/...` namespace + `packages: write`) is what
# links the package to this repository and makes it public — a manual docker
# push creates an unlinked, private, user-scoped package. Run manually, or it
# runs automatically whenever kernel/packaging changes land on main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [kernel/**, packaging/**]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly Rust + tools
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-02
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Install bootimage
        run: cargo install bootimage --version 0.10.5

      - name: Build kernel boot image
        working-directory: kernel
        run: cargo build && cargo bootimage

      - name: Stage a minimal build context
        run: |
          mkdir -p /tmp/lionos-ctx
          cp target/x86_64-unknown-none/debug/bootimage-lionos-kernel.bin /tmp/lionos-ctx/bootimage-lionos-kernel.bin

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase GHCR image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/lionos" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: /tmp/lionos-ctx
          file: packaging/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          platforms: linux/amd64