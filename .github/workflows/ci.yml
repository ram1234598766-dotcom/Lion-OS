name: ci

on:
  push:
  pull_request:

jobs:
  kernel-boot:
    name: Build + boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (QEMU + mtools)
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 mtools

      - name: Install pinned nightly Rust with freestanding target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-02
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Install bootimage tool
        run: cargo install bootimage --version 0.10.5

      - name: Build executable + bootable image
        run: cargo build && cargo bootimage

      - name: Secret scan (gitleaks, current tree)
        run: |
          curl -fsSL -o /tmp/g.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf /tmp/g.tgz -C /tmp gitleaks && chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --no-git --no-banner .

      - name: Boot smoke test (positive — expect LIONOS_INIT_OK)
        run: |
          set -e
          timeout 45 qemu-system-x86_64 -nographic -no-reboot \
            -drive format=raw,file=target/x86_64-unknown-none/debug/bootimage-lionos-kernel.bin \
            -serial file:/tmp/boot-positive.log || true
          grep -q "LIONOS_INIT_OK" /tmp/boot-positive.log
          echo "PASS: LIONOS_INIT_OK observed on serial"

      - name: Boot smoke test (negative — must FAIL when marker is wrong)
        run: |
          set -e
          # Rebuild the SAME kernel with a deliberately different marker.
          # kernel/build.rs (rerun-if-env-changed) forces the recompile.
          LIONOS_BOOT_MARKER=LIONOS_NEGATIVE cargo bootimage
          timeout 45 qemu-system-x86_64 -nographic -no-reboot \
            -drive format=raw,file=target/x86_64-unknown-none/debug/bootimage-lionos-kernel.bin \
            -serial file:/tmp/boot-negative.log || true
          grep -q "LIONOS_NEGATIVE" /tmp/boot-negative.log        # broken marker DID boot
          if grep -q "LIONOS_INIT_OK" /tmp/boot-negative.log; then
            echo "ERROR: original marker still present — negative test broken"
            exit 1
          fi
          echo "PASS: negative boot correctly lacks the checkpoint string"