name: ci

on:
  push:
  pull_request:

jobs:
  kernel-boot:
    name: Build + boot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (QEMU + mtools + NASM + g++ + Zig 0.14)
        # NASM assembles asm/port_io.asm + cpu_utils.asm via build.rs; the
        # kernel also compiles C++17 (g++ frontend) and Zig (`zig build-obj`)
        # from the Month-3 language lay, so all are required for `cargo build`.
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 mtools nasm g++ build-essential
          curl -sL -o /tmp/zig.tar.xz https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz
          sudo mkdir -p /opt/zig && sudo tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          sudo ln -sf /opt/zig/zig /usr/local/bin/zig
          zig version

      - name: Install pinned nightly Rust with freestanding target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-02
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      # bootimage is gone in the bootloader 0.11 era: the bootable image is
      # produced by the `os/` crate (bootloader 0.11 DiskImageBuilder), which
      # consumes the kernel bin as a build artifact. First build compiles the
      # BIOS stage crates, so a fresh runner needs network here.
      - name: Build kernel ELF
        working-directory: kernel
        run: cargo build

      - name: Build bootable disk image (bootloader 0.11)
        working-directory: os
        run: cargo build

      - name: Run kernel unit tests (host target — pure parsers)
        working-directory: kernel
        run: cargo test --target x86_64-unknown-linux-gnu

      - name: Secret scan (gitleaks, current tree)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/g.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/g.tgz" -C "$RUNNER_TEMP" gitleaks && chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" detect --no-git --no-banner .

      - name: Boot smoke test (positive — handoff + framebuffer + fmt + LIONOS_INIT_OK)
        working-directory: kernel
        run: |
          set -e
          # -vga std guarantees a VGA framebuffer even under -nographic, so the
          # framebuffer handoff is exercised (else LIONOS_FB_NONE).
          timeout 45 qemu-system-x86_64 -nographic -no-reboot -vga std \
            -drive format=raw,file=../target/bios.img \
            -serial file:"$RUNNER_TEMP/boot-positive.log" || true
          grep -q "LIONOS_HANDOFF_OK" "$RUNNER_TEMP/boot-positive.log"    # BootInfo consumed + validated
          grep -q "LIONOS_MEM_MAP regions=" "$RUNNER_TEMP/boot-positive.log" # memory-map summary printed
          grep -q "LIONOS_FB_OK" "$RUNNER_TEMP/boot-positive.log"         # framebuffer handoff (bootloader 0.11)
          grep -q "LIONOS_FMT_OK" "$RUNNER_TEMP/boot-positive.log"        # core::fmt via serial (re-enabled)
          grep -q "LIONOS_INIT_OK" "$RUNNER_TEMP/boot-positive.log"       # Week-1 checkpoint preserved
          # C + assembly integration is exercised at boot and must be healthy.
          # Rust->C framebuffer drawing, C->asm CPUID, Rust->asm (msr/rflags/spinlock).
          grep -q "\[ffi\]" "$RUNNER_TEMP/boot-positive.log"
          grep -q "memset=abababababababab" "$RUNNER_TEMP/boot-positive.log"
          grep -q "memcpy_ok=1" "$RUNNER_TEMP/boot-positive.log"
          grep -q "LIONOS_FB_DRAW_OK" "$RUNNER_TEMP/boot-positive.log"    # C framebuffer drawing ran
          grep -q "LIONOS_CPUID_LEAF1EDX=" "$RUNNER_TEMP/boot-positive.log" # C->asm (cpuid)
          grep -q "LIONOS_ASM rflags=" "$RUNNER_TEMP/boot-positive.log"   # Rust->asm (rflags/msr/spinlock)
          grep -q "spin=1" "$RUNNER_TEMP/boot-positive.log"
          # Month 2 interrupt bring-up: IDT/PIC/PIT installed, IF=1, timer fired.
          grep -q "LIONOS_IRQ_FLAGS=" "$RUNNER_TEMP/boot-positive.log"    # sti executed (interrupt flag set)
          grep -q "LIONOS_TIMER_TICKS=" "$RUNNER_TEMP/boot-positive.log"  # PIT timer ISR incremented ticks
          grep -q "LIONOS_IRQ_OK" "$RUNNER_TEMP/boot-positive.log"        # M2 bring-up + deferred drain complete
          # Month 2 heap: #[global_allocator] live, Vec/Box exercised at boot.
          grep -q "LIONOS_HEAP_OK cap=" "$RUNNER_TEMP/boot-positive.log"  # global allocator + Vec/Box
          grep -q "sum=6048" "$RUNNER_TEMP/boot-positive.log"             # Vec sum integrity check
          grep -q "box=00000000000000a5" "$RUNNER_TEMP/boot-positive.log" # Box value intact
          # Month 2 physical frame allocator (pure accounting, boots).
          grep -q "LIONOS_FRAMES total=" "$RUNNER_TEMP/boot-positive.log" # frame allocator init'd over usable regions
          grep -q "LIONOS_FRAME_ALLOC phys=" "$RUNNER_TEMP/boot-positive.log" # alloc/dealloc exercised
          grep -q "LIONOS_PML4 cr3=" "$RUNNER_TEMP/boot-positive.log"     # paging infra (CR3 read) live
          # Month-1 NASM + C string smoke (master-plan language lay): the NASM
          # port_io/cpu_utils objects and C string helpers ran without a fault.
          grep -q "LIONOS_NASM" "$RUNNER_TEMP/boot-positive.log"          # NASM port-I/O + CPU utils exercised
          grep -q "vendor_nasm=" "$RUNNER_TEMP/boot-positive.log"         # NASM cpuid_query returned a vendor string
          grep -q "LIONOS_C_STR len=4" "$RUNNER_TEMP/boot-positive.log"   # C lionos_strlen("LION") == 4
          grep -q "cmp=0" "$RUNNER_TEMP/boot-positive.log"                # C lionos_strcmp(a, a) == 0
          grep -q "hex=0x00000000deadbeef" "$RUNNER_TEMP/boot-positive.log" # C lionos_itoa_hex deterministic
          grep -q "LIONOS_C_MEMMOVE" "$RUNNER_TEMP/boot-positive.log"     # C lion_memmove overlap-safe
          # Month-2 paging TAKEOVER (M2W3c unblock): kernel owns CR3 (physical
          # window mapping enabled in BootloaderConfig) and maps a frame.
          grep -q "LIONOS_TAKEOVER cr3=" "$RUNNER_TEMP/boot-positive.log" # fresh kernel-owned PML4 at a physical frame
          grep -q "LIONOS_CR3_NOW=" "$RUNNER_TEMP/boot-positive.log"      # confirmed the switch (CR3 -> our frame)
          grep -q "owned=1" "$RUNNER_TEMP/boot-positive.log"              # current_cr3() == our new PML4
          grep -q "LIONOS_MAP_RW back=deadbeefcafef00d" "$RUNNER_TEMP/boot-positive.log" # map/unmap round-trip
          grep -q "phys_ok=1" "$RUNNER_TEMP/boot-positive.log"            # translate(pte) == the frame we mapped
          # Month-2 GDT + TSS/IST: custom GDT installed with an IST0 double-fault
          # stack (lgdt + ltr both succeeded, else the boot triple-faults here).
          grep -q "LIONOS_GDT_OK ist0=" "$RUNNER_TEMP/boot-positive.log"  # 64-bit TSS with IST0 wired
          # Month-3 device drivers (required + extra): each prints a marker so a
          # driver that silently fails to init is caught in CI.
          grep -q "LIONOS_DRV_RTC " "$RUNNER_TEMP/boot-positive.log"       # CMOS clock read a timestamp
          grep -q "LIONOS_DRV_PCI devs=" "$RUNNER_TEMP/boot-positive.log"  # PCI bus 0 enumerated devices
          grep -q "LIONOS_DRV_VGA ok" "$RUNNER_TEMP/boot-positive.log"     # VGA text-mode console
          grep -q "LIONOS_DRV_SPEAKER ok" "$RUNNER_TEMP/boot-positive.log" # PC speaker beep
          grep -q "LIONOS_DRV_KBD decode_a=97" "$RUNNER_TEMP/boot-positive.log" # PS/2 scancode decode('a')
          grep -q "LIONOS_DRV_MOUSE armed" "$RUNNER_TEMP/boot-positive.log" # PS/2 mouse armed
          grep -q "LIONOS_DRV_FACEID auth=1 deny=1" "$RUNNER_TEMP/boot-positive.log" # biometric gate authenticates + denies
          grep -q "LIONOS_FB_TEXT ok" "$RUNNER_TEMP/boot-positive.log"     # framebuffer bitmap-font text
          # M3 disk layer: ATA PIO enumerated the (single, non-FAT) boot image in
          # CI and rejected it honestly — the FAT32 mount is covered by the
          # second-drive integration boot elsewhere in this workflow.
          grep -q "LIONOS_DRV_IDE disks=" "$RUNNER_TEMP/boot-positive.log" # ATA PIO probe ran
          grep -q "LIONOS_FS_NONE_MOUNTED" "$RUNNER_TEMP/boot-positive.log" # no FAT volume -> honest reject
          # M3 Task-4 driver set (QEMU i440fx exposes an e1000 NIC + an I/O APIC by
          # default, so these are real FOUNDs; the rest report ABSENT — never fault).
          grep -q "LIONOS_DRV_E1000 found=1" "$RUNNER_TEMP/boot-positive.log" # e1000 NIC detected
          grep -q "LIONOS_DRV_IOAPIC found=1" "$RUNNER_TEMP/boot-positive.log" # I/O APIC enumerated
          grep -q "LIONOS_DRV_HPET " "$RUNNER_TEMP/boot-positive.log"          # HPET marker fires (found or absent)
          grep -q "LIONOS_SCHED tasks=" "$RUNNER_TEMP/boot-positive.log"      # cooperative + PIT scheduler woke
          grep -q "LIONOS_CPP magic=" "$RUNNER_TEMP/boot-positive.log"        # C++17 object linked + ran
          grep -q "LIONOS_ZIG magic=" "$RUNNER_TEMP/boot-positive.log"        # Zig object linked + ran
          # Month 4: ring-3 + syscall round trip. USER_CS=0x2b proves the user
          # process really executed at ring 3 (CS = USER_CODE(0x28)|RPL3) and
          # crossed user->kernel->user; USER_CALLS counts every serviced syscall.
          grep -q "LIONOS_SYSCALL_MSR star=" "$RUNNER_TEMP/boot-positive.log" # syscall MSRs programmed (STAR/LSTAR/SFMASK + EFER.SCE)
          grep -q "LIONOS_USER_DROP" "$RUNNER_TEMP/boot-positive.log"         # iretq descent to ring 3 happened
          grep -q "LIONOS_USER_CS=000000000000002b" "$RUNNER_TEMP/boot-positive.log" # user executed at CPL3 and syscalls round-tripped
          grep -q "LIONOS_USER_CALLS=6" "$RUNNER_TEMP/boot-positive.log"     # 6 user syscalls serviced (getc/putc/sleep/recv/send/exit)
          grep -q "LIONOS_SHELL_READ n=" "$RUNNER_TEMP/boot-positive.log"   # ring-3 shell drained the IPC mailbox
          grep -q "LIONOS_SHELL_WROTE n=" "$RUNNER_TEMP/boot-positive.log"  # ring-3 shell wrote the IPC ack
          # Month 5: graphics foundation (safe Canvas + double-buffer present).
          grep -q "LIONOS_GFX_CANVAS ok" "$RUNNER_TEMP/boot-positive.log"    # bounds-checked Canvas drew
          grep -q "LIONOS_GFX_DBLBUF present=" "$RUNNER_TEMP/boot-positive.log" # back buffer presented into front
          echo "PASS: handoff + fb + fmt + LIONOS_INIT_OK + C/asm + M2 IRQ + M2 heap + M2 frames + paging takeover + GDT/TSS + NASM/C-str + M3 layer + M3 ATA/FS + M3 Task-4 set + M4 ring3/syscall round trip observed on serial"

      - name: Boot smoke test (read-only FAT32 over ATA PIO second drive)
        working-directory: os
        run: |
          set -e
          # A real mtools FAT32 volume on the secondary ATA channel: the kernel
          # must enumerate both channels, reject the (non-FAT) boot image, and
          # mount+read a file from the genuine FAT disk.
          mkdir -p "$RUNNER_TEMP"
          printf "Hello, LionOS read-only FAT32 over ATA PIO\r\n" > "$RUNNER_TEMP/hello.txt"
          dd if=/dev/zero of="$RUNNER_TEMP/fs.img" bs=1M count=4 status=none
          mkfs.fat -F 32 "$RUNNER_TEMP/fs.img"
          mcopy -i "$RUNNER_TEMP/fs.img" "$RUNNER_TEMP/hello.txt" ::/HELLO.TXT
          timeout 45 qemu-system-x86_64 -nographic -no-reboot -vga std \
            -drive format=raw,file=../target/bios.img,index=0,if=ide \
            -drive format=raw,file="$RUNNER_TEMP/fs.img",index=2,if=ide \
            -serial file:"$RUNNER_TEMP/boot-fat.log" || true
          grep -q "LIONOS_DRV_IDE disks=2" "$RUNNER_TEMP/boot-fat.log"        # both ATA channels enumerated
          grep -q "LIONOS_FS_OK disk=1" "$RUNNER_TEMP/boot-fat.log"           # FAT32 volume mounted (secondary)
          grep -q "LIONOS_FS_LS count=1" "$RUNNER_TEMP/boot-fat.log"          # root dir walk found the file
          grep -q "LIONOS_FS_READ name=HELLO.TXT bytes=44 head=000000006c6c6548" "$RUNNER_TEMP/boot-fat.log" # 44 bytes, first-4 "Hell"
          echo "PASS: read-only FAT32 mounted + listed + byte-read a real file over ATA PIO"

      - name: Boot smoke test (negative — must FAIL when marker is wrong)
        working-directory: kernel
        run: |
          set -e
          # Rebuild the SAME kernel with a deliberately different marker.
          # kernel/build.rs (rerun-if-env-changed) forces the recompile. The
          # marker must be set on BOTH builds: `os/` rebuilds the kernel as its
          # own build artifact (separate cargo invocation, separate cache).
          LIONOS_BOOT_MARKER=LIONOS_NEGATIVE cargo build
          (cd ../os && LIONOS_BOOT_MARKER=LIONOS_NEGATIVE cargo build)
          timeout 45 qemu-system-x86_64 -nographic -no-reboot -vga std \
            -drive format=raw,file=../target/bios.img \
            -serial file:"$RUNNER_TEMP/boot-negative.log" || true
          grep -q "LIONOS_NEGATIVE" "$RUNNER_TEMP/boot-negative.log"        # broken marker DID boot
          if grep -q "LIONOS_INIT_OK" "$RUNNER_TEMP/boot-negative.log"; then
            echo "ERROR: original marker still present — negative test broken"
            exit 1
          fi
          echo "PASS: negative boot correctly lacks the checkpoint string"

  launcher-build:
    name: launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14            # Apple Silicon
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build launcher
        working-directory: launcher
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run launcher tests
        working-directory: launcher
        run: cargo test --target ${{ matrix.target }}

      - name: Upload launcher binary
        uses: actions/upload-artifact@v4
        with:
          name: lionos-${{ matrix.target }}
          path: launcher/target/${{ matrix.target }}/release/lionos${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          if-no-files-found: error

  # Intel-macOS builds are kept as their own job: macos-13 was RETIRED by
  # GitHub in December 2025 (jobs queue forever, no runner ever picks them up),
  # so the plan mandates macos-15-intel for the x86_64 macOS target. Free-tier
  # Intel runners are still contended, so keep this on its own job so it can't
  # block the Linux e2e below.
  launcher-build-intel:
    name: launcher (macos-15-intel x64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build launcher
        working-directory: launcher
        run: cargo build --release --target x86_64-apple-darwin
      - name: Run launcher tests
        working-directory: launcher
        run: cargo test --target x86_64-apple-darwin
      - name: Upload launcher binary
        uses: actions/upload-artifact@v4
        with:
          name: lionos-x86_64-apple-darwin
          path: launcher/target/x86_64-apple-darwin/release/lionos
          if-no-files-found: error

  launcher-e2e:
    name: launcher e2e (boots kernel from artifact)
    needs: launcher-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU + NASM + Zig 0.14 + g++
        # os/ rebuilds the kernel as a build artifact, which assembles NASM,
        # compiles C++17 (g++ frontend) and Zig (`zig build-obj`), so all are
        # required here too.
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 nasm g++ build-essential
          curl -sL -o /tmp/zig.tar.xz https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz
          sudo mkdir -p /opt/zig && sudo tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          sudo ln -sf /opt/zig/zig /usr/local/bin/zig
          zig version

      - name: Install pinned nightly + build boot image
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-08-02
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Build kernel boot image (bootloader 0.11)
        working-directory: os
        run: cargo build

      - name: Download launcher binary (clean CI artifact)
        uses: actions/download-artifact@v4
        with:
          name: lionos-x86_64-unknown-linux-gnu
          path: /tmp/lionos

      - name: Run end-to-end from the downloaded artifact
        run: |
          set -e
          chmod +x /tmp/lionos/lionos
          timeout 45 /tmp/lionos/lionos run --headless > /tmp/e2e.log 2>&1 || true
          grep -q "LIONOS_INIT_OK" /tmp/e2e.log
          echo "PASS: downloaded lionos binary booted the kernel (marker observed)"