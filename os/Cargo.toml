[package]
name = "os"
version = "0.1.0"
edition = "2021"
description = "LionOS disk-image builder (bootloader 0.11 DiskImageBuilder)"

# Standalone crate (own [workspace], like launcher/ and fuzz/) so the root
# workspace's freestanding build target cannot leak in. Build from THIS dir.
[workspace]

[build-dependencies]
# 0.11: the bootloader crate is a build-time image builder, not a kernel dep.
bootloader = "0.11.17"
# Kernel ELF as a build artifact (dep key MUST be the package name). Env var
# becomes CARGO_BIN_FILE_LIONOS_KERNEL_lionos-kernel.
lionos-kernel = { path = "../kernel", artifact = "bin", target = "x86_64-unknown-none" }

# Same lean-image rationale as the root workspace (bootloader PageAlreadyMapped):
# the freestanding kernel must sit under the bootloader's frame headroom, so
# compile THIS dependency at opt-level 1 even in a debug build.
[profile.dev.package.lionos-kernel]
opt-level = 1
