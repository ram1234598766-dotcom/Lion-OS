[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lion-os-desktop"
version = "2.0.0"
description = "Lion-OS - a full graphical desktop operating system that runs inside Python (Pygame). Boot, login, desktop, window manager and apps."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mrityunjay" }]
keywords = ["os", "desktop", "operating-system", "pygame", "gui", "lionos", "window-manager"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: Window Managers",
    "Topic :: System :: Operating System",
]
dependencies = [
    "pygame-ce>=2.4.0",
    "psutil>=5.9",
    "requests>=2.28",
]

[project.optional-dependencies]
ai = [
    "openai>=1.0",
]
dev = [
    "pytest>=7.0",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/ram1234598766-dotcom/Lion-OS"
Repository = "https://github.com/ram1234598766-dotcom/Lion-OS"
Issues = "https://github.com/ram1234598766-dotcom/Lion-OS/issues"

[project.scripts]
lionos = "lionos.cli:main"
lion-os-desktop = "lionos.cli:main"

[tool.setuptools]
packages = ["lionos", "lionos.apps", "lionos.ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
