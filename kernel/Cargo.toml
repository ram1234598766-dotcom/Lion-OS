[package]
name = "lionos-kernel"
version = "0.1.0"
edition = "2021"
description = "LionOS bare-metal x86_64 kernel (Month 1)"

# The kernel depends on `bootloader_api` (the 0.11 kernel-side contract:
# `BootInfo`, `entry_point!`, `MemoryRegion`). The `bootloader` crate
# (DiskImageBuilder) is NOT a kernel dependency anymore — it is a
# build-dependency of the `os/` image-builder crate, which wraps this crate's
# `lionos-kernel` bin into a BIOS disk image (`../os/build.rs`). The kernel and
# the bootloader no longer share a `BootInfo` layout at compile time; 0.11
# serializes the `BootloaderConfig` into the kernel ELF instead.
[dependencies]
bootloader_api = "0.11.17"

# Library + binary split so the kernel's pure parsers (memory-map/framebuffer
# validation) can be unit-tested on the host and fuzzed with cargo-fuzz. The bin
# is excluded from `cargo test` (it is `#![no_main]` and needs no harness).
[lib]
name = "lionos_kernel"
path = "src/lib.rs"

[[bin]]
name = "lionos-kernel"
path = "src/main.rs"
test = false