[package]
name = "lionos"
version = "0.1.0"
edition = "2021"
description = "LionOS host-side launcher CLI"

# Standalone crate; not a member of the kernel workspace (which targets
# x86_64-unknown-none). Build from this directory so launcher/.cargo/config.toml
# selects the host target. Revisit workspace membership once the launcher and
# kernel share a build in a later month.
[workspace]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
